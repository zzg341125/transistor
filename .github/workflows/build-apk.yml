name: Build Android APK

on:
  push:
    branches: [ "main", "master" ] # 当推送到 main 或 master 分支时自动触发
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout 源码
      uses: actions/checkout@v4

    - name: 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 授予 Gradle 执行权限
      run: chmod +x gradlew

    - name: 使用 Gradle 构建 Debug APK
      run: ./gradlew assembleDebug

    - name: 上传构建好的 APK
      uses: actions/upload-artifact@v4
      with:
        name: transistor-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
